models:
  - name: stg_jaffle_shop__customers
    description: One customer will be represent by row at the same time
    columns:
      - name: customer_id
        description: Unique identifier for each customer
        data_tests:
          - not_null
          - unique
  - name: stg_jaffle_shop__orders
    description: Contains all orders operate in the system
    columns:
      - name: order_id
        description: Unique identifier for each order
        data_tests:
          # Permet de verifier la clé primaire
          - not_null
          - unique
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          # Permet de verifier une liste de valeurs acceptées
          - accepted_values:
              arguments:
                values: ['completed', 'placed', 'shipped', 'returned', 'return_pending']
      - name: customer_id
        description: Permet de verifier la clé étragère
        data_tests:
         - relationships:
            arguments:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      