sources:
  - name: jaffle_shop 
    description: A clone of a Postgres Database 
    database: raw
    schema: jaffle_shop
    tables:  
      - name: customers
        description: Raw of customers data
        #On peut ajouter des tests de données sur les sources
        columns:
          - name: id
            description: Primary Key of customers table
            data_tests:
              - not_null
              - unique
      - name: orders
        config:
          freshness:
            warn_after: 
              count: 12 
              period: hour
            error_after: 
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at    
